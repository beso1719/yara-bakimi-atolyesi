<title>Yara Bakım Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hastalar için resimli, adım adım yara bakımı oyunu: ameliyat yarası pansumanı, küçük yanıkta ilk yardım, bası yarasından korunma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Yerleşim: oyuncak masası. Üstte sahne (hasta), yanında hemşire balonu, altta ahşap masa üstünde malzemeler.
   Tek, aydınlık bir görsel dünya (bilinçli olarak tek tema). */
:root{
  --bg:#EAF6F1; --bg-2:#DCEFE7; --card:#FFFFFF; --ink:#22314A; --ink-2:#5B6C83; --line:#D3E5DD;
  --coral:#FF7563; --coral-soft:#FFE4DE; --sky:#3FA2DB; --sky-soft:#DDF0FB; --sun:#FFC64A; --mint:#22A88F; --mint-soft:#D4F2EA;
  --wood:#EBC796; --wood-2:#D6A86F; --wood-3:#B8854B;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 8%,#F6FBF9 0 140px,transparent 141px),radial-gradient(circle at 92% 30%,#E2F3FB 0 180px,transparent 181px),radial-gradient(circle at 70% 96%,#FFF3DA 0 160px,transparent 161px)}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.08;text-wrap:balance;font-weight:800}
p{margin:0}

.wrap{max-width:1180px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px}
.logo svg{width:44px;height:44px}
.logo b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;white-space:nowrap}
.sp{flex:1}
.round-btn{width:48px;height:48px;border-radius:16px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.round-btn svg{width:24px;height:24px}
.round-btn:active{transform:translateY(2px);box-shadow:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:18px;border:0;
  background:var(--card);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--coral);color:#fff;box-shadow:0 4px 0 #D9503F}
.btn.blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 #2A7FB2}

/* ana sayfa */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:24px;align-items:center;margin:8px 0 26px}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.01em}
.hero h1 span{color:var(--coral)}
.hero p{margin-top:12px;font-size:1.15rem;color:var(--ink-2);max-width:46ch}
.hero-art{background:var(--card);border-radius:32px;padding:14px;box-shadow:0 18px 40px -22px rgba(34,49,74,.4);min-width:0}
.hero-art svg{display:block;width:100%;height:auto;border-radius:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.scn{text-align:left;border:0;background:var(--card);border-radius:28px;padding:14px;cursor:pointer;display:grid;gap:10px;
  box-shadow:0 6px 0 var(--line);transition:transform .2s;min-width:0}
.scn:hover{transform:translateY(-4px) rotate(-.4deg)}
.scn-art{border-radius:20px;overflow:hidden;background:var(--bg-2)}
.scn-art svg{display:block;width:100%;height:auto}
.scn h3{font-size:1.4rem;padding:0 6px}
.scn p{color:var(--ink-2);padding:0 6px;font-size:.98rem}
.scn-foot{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px}
.tag{font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:999px;background:var(--mint-soft);color:#11705F}
.stars{display:inline-flex;gap:2px}
.stars svg{width:24px;height:24px}

/* oyun ekranı */
.play{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-areas:"head head" "stage nurse" "table table";gap:16px}
.play-head{grid-area:head;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.play-head h1{font-size:clamp(1.4rem,3.4vw,2rem)}
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dot{width:38px;height:38px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--ink-2)}
.dot svg{width:26px;height:26px}
.dot.now{border-color:var(--coral);color:var(--coral);animation:bob 1.2s ease-in-out infinite}
.dot.done{border-color:var(--mint);background:var(--mint-soft)}
.stage{grid-area:stage;position:relative;background:var(--card);border-radius:30px;padding:12px;box-shadow:0 18px 40px -24px rgba(34,49,74,.45);min-width:0}
.stage svg.scene{display:block;width:100%;height:auto;border-radius:22px}
.stage.drop{outline:5px dashed var(--sky);outline-offset:-6px}
.stage-cap{display:none}
.face{position:absolute;top:22px;left:22px;width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.face svg{width:68px;height:68px}
.nurse{grid-area:nurse;display:flex;flex-direction:column;gap:12px;min-width:0}
.nurse-top{display:flex;gap:12px;align-items:flex-end}
.nurse-top svg{width:84px;height:84px;flex:none}
.nurse-top b{font-family:var(--f-display);font-size:1.15rem}
.nurse-top small{display:block;color:var(--ink-2);font-weight:700}
.bubble{position:relative;background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:0 6px 0 var(--line);font-size:1.08rem;animation:pop .35s}
.bubble::before{content:"";position:absolute;top:-12px;left:30px;border:12px solid transparent;border-top:0;border-bottom-color:var(--card)}
.bubble h2{font-size:1.45rem;margin-bottom:6px}
.bubble .why{margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--sky-soft);font-size:1rem}
.bubble.oops{background:var(--coral-soft)}
.bubble.oops::before{border-bottom-color:var(--coral-soft)}
.bubble.yay{background:var(--mint-soft)}
.bubble.yay::before{border-bottom-color:var(--mint-soft)}
.nurse-actions{display:flex;gap:10px;flex-wrap:wrap}

.table{grid-area:table;position:relative;border-radius:30px;padding:22px 18px 26px;
  background:linear-gradient(180deg,var(--wood) 0%,var(--wood-2) 100%);box-shadow:inset 0 -10px 0 var(--wood-3),0 18px 30px -20px rgba(80,50,20,.6)}
.table::before{content:"";position:absolute;inset:12px 14px 22px;border-radius:22px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 46px);pointer-events:none}
.table-title{position:relative;font-family:var(--f-display);font-weight:800;color:#6B4419;margin:0 0 10px 6px;font-size:1.05rem}
.items{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.item{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;display:grid;justify-items:center;gap:2px;padding:10px 6px 10px;border-radius:22px;border:0;
  background:rgba(255,255,255,.88);cursor:grab;box-shadow:0 5px 0 rgba(120,80,30,.35);transition:transform .15s}
.item:hover{transform:translateY(-4px) rotate(-2deg)}
.item svg{width:74px;height:74px}
.item span{font-weight:800;font-size:.92rem;line-height:1.15;text-align:center}
.item.used{background:rgba(255,255,255,.6)}
.item.used::after{content:"✓";position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--mint);color:#fff;font-size:.8rem;display:grid;place-items:center;font-weight:800}
.item.hint{animation:hint 1s ease-in-out 3}
.item.wiggle{animation:wiggle .5s}
.item.dragging{opacity:.35}
.flyer{position:fixed;left:0;top:0;z-index:500;pointer-events:none;width:84px;height:84px}
.flyer svg{width:100%;height:100%}

/* son ekran */
.done{display:grid;gap:22px;justify-items:center;text-align:center;max-width:1000px;margin:0 auto}
.done h1{font-size:clamp(2.2rem,6vw,3.4rem)}
.done .big-face svg{width:150px;height:150px}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;width:100%;text-align:left}
.rc{background:var(--card);border-radius:22px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;box-shadow:0 5px 0 var(--line)}
.rc svg{width:58px;height:58px}
.rc b{display:block;font-family:var(--f-display);font-size:1.1rem;line-height:1.15}
.rc small{color:var(--ink-2);font-weight:600;font-size:.9rem}
.rc .n{font-family:var(--f-display);font-weight:800;color:var(--coral)}
.warn{width:100%;background:#FFF4E6;border-radius:26px;padding:18px;display:grid;gap:12px;text-align:left;border:3px dashed #F4B266}
.warn h2{font-size:1.5rem}
.warn-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.wl{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;font-weight:700}
.wl svg{width:44px;height:44px;flex:none}
.row-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* iyileşme takvimi */
.tl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.tl-art{background:var(--card);border-radius:30px;padding:12px;box-shadow:0 18px 40px -24px rgba(34,49,74,.45)}
.tl-art svg{display:block;width:100%;height:auto;border-radius:22px}
.tl-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px}
.tl-steps button{border:0;border-radius:14px;padding:10px 4px;background:var(--card);font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 4px 0 var(--line);line-height:1.15}
.tl-steps button.on{background:var(--sky);color:#fff;box-shadow:0 4px 0 #2A7FB2}
input[type=range]{width:100%;accent-color:var(--coral);margin-top:12px;height:28px}
.tl-card{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--line);display:grid;gap:12px;animation:pop .3s}
.tl-card h2{font-size:1.8rem}
.tl-card .when{font-weight:800;color:var(--coral);font-family:var(--f-display);font-size:1.1rem}
.todo{display:grid;gap:8px}
.todo div{display:flex;gap:10px;align-items:flex-start;background:var(--mint-soft);border-radius:14px;padding:10px 12px;font-weight:700}
.todo div::before{content:"✓";width:24px;height:24px;flex:none;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-size:.8rem}

/* sahne katmanları */
.L{opacity:0;transition:opacity .6s,transform .9s cubic-bezier(.3,.9,.3,1);transform-box:fill-box;transform-origin:center}
.L.on{opacity:1}
.peel{transform:translate(120px,-260px) rotate(28deg)!important;opacity:0!important}
.gone{transform:translate(160px,-40px) rotate(-30deg)!important;opacity:0!important}
.up{transform:translateY(-10px)}
.fall{animation:fall 1s linear infinite}
.wipe-go{animation:wipe 1.1s ease-in-out infinite}
.pat-go{animation:pat .6s ease-in-out infinite}
.stream{animation:stream .5s linear infinite}
.spin{animation:spin 4s linear infinite;transform-origin:center;transform-box:fill-box}
.twinkle{animation:twinkle 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:floaty 2s ease-in-out infinite}
.bubbles circle{animation:bubbleUp 1.4s ease-in infinite}
.timer-arc{animation:timer 2.6s linear forwards}
@keyframes fall{from{transform:translateY(-20px);opacity:0}30%{opacity:1}to{transform:translateY(60px);opacity:0}}
@keyframes wipe{0%{transform:translateY(0)}100%{transform:translateY(170px)}}
@keyframes pat{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
@keyframes stream{from{stroke-dashoffset:0}to{stroke-dashoffset:-24}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bubbleUp{0%{transform:translateY(8px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-30px) scale(1.1);opacity:0}}
@keyframes timer{from{stroke-dashoffset:0}to{stroke-dashoffset:-176}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes hint{0%,100%{transform:scale(1);box-shadow:0 5px 0 rgba(120,80,30,.35)}50%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(255,198,74,.85)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:900}

@media (max-width:860px){
  .hero,.tl{grid-template-columns:minmax(0,1fr)}
  .play{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "nurse" "table"}
  .strip{margin-left:0}
  .stage-cap{display:block;position:absolute;left:14px;right:14px;bottom:14px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.94);font-family:var(--f-display);font-weight:800;font-size:1.02rem;text-align:center;box-shadow:0 3px 0 var(--line);animation:pop .3s}
  .stage-cap.oops{background:var(--coral-soft)}
  .stage-cap.yay{background:var(--mint-soft)}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px;border-radius:24px}
}
@media (max-width:520px){
  body{font-size:16px}
  .items{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .item svg{width:56px;height:56px}
  .item span{font-size:.8rem}
  .dot{width:32px;height:32px}
  .dot svg{width:20px;height:20px}
  .face{width:58px;height:58px;top:16px;left:16px}
  .face svg{width:52px;height:52px}
  .tl-steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .logo b{font-size:1.15rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
