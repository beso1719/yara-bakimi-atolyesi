<title>Yara Bakımı Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hemşirelik öğrencileri için yanık, bası yarası ve cerrahi kesi iyileşmesi, tedavi seçimi ve aseptik pansuman oyunu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Yerleşim: steril örtü kâğıdı zemin; ilerleme = otoklav indikatör bandı (çizgiler sterilizasyonla koyulaşır).
   Menü = bölüm kartları ızgarası, oyun = tek sahne kartı + üstte HUD. */
:root{
  --paper:#EDF3F1; --paper-2:#E0E9E6; --card:#FBFDFC; --card-2:#F2F7F5;
  --ink:#0F252E; --ink-2:#4B636B; --line:#C8D7D3;
  --teal:#0A7A72; --teal-ink:#FFFFFF; --teal-soft:#D3EBE7;
  --tape:#E8DCBC; --tape-ink:#3A2E21;
  --wound:#C23E37; --wound-soft:#F8E0DD; --ok:#1F7F55; --ok-soft:#D7EFE3; --warn:#A86E07;
  --fig:#E3D2C5; --fig-line:#B39784;
  --shadow:0 1px 2px rgba(15,37,46,.06), 0 10px 28px -14px rgba(15,37,46,.22);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B161B; --paper-2:#0F1E24; --card:#13242B; --card-2:#182D35;
    --ink:#E4EFED; --ink-2:#97AFB0; --line:#273E45;
    --teal:#3CC0B1; --teal-ink:#05201C; --teal-soft:#123B38;
    --tape:#3B3427; --tape-ink:#EAD5A2;
    --wound:#F2675C; --wound-soft:#3A1F1E; --ok:#4FC98F; --ok-soft:#133429; --warn:#E9B14C;
    --fig:#3A4C52; --fig-line:#62797F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B161B; --paper-2:#0F1E24; --card:#13242B; --card-2:#182D35;
  --ink:#E4EFED; --ink-2:#97AFB0; --line:#273E45;
  --teal:#3CC0B1; --teal-ink:#05201C; --teal-soft:#123B38;
  --tape:#3B3427; --tape-ink:#EAD5A2;
  --wound:#F2675C; --wound-soft:#3A1F1E; --ok:#4FC98F; --ok-soft:#133429; --warn:#E9B14C;
  --fig:#3A4C52; --fig-line:#62797F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.55 var(--f-body);
  background-image:
    repeating-linear-gradient(115deg, color-mix(in oklab, var(--ink) 3.5%, transparent) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(25deg, color-mix(in oklab, var(--ink) 2%, transparent) 0 1px, transparent 1px 11px);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- üst çubuk ---------- */
.appbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  background:color-mix(in oklab, var(--paper) 86%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.appbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px;margin-left:-4px}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{white-space:nowrap;text-align:left;font-family:var(--f-display);font-size:1.08rem;font-weight:750;letter-spacing:-.01em}
.bar-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.9rem}
.pill svg{width:16px;height:16px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{border-color:var(--teal)}

.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- butonlar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-weight:650;cursor:pointer;transition:transform .15s, box-shadow .15s, background .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 14px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------- indikatör bant ---------- */
.tape{position:relative;height:14px;border-radius:4px;background:var(--tape);overflow:hidden;
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--tape-ink) 18%, transparent)}
.tape>i{position:absolute;inset:0 auto 0 0;width:var(--p,0%);transition:width .6s cubic-bezier(.2,.8,.2,1);
  background:repeating-linear-gradient(-45deg,var(--tape-ink) 0 5px,transparent 5px 13px),var(--tape)}
.tape-label{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--ink-2);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;font-weight:650}

/* ---------- menü ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:36px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:750;margin-bottom:12px}
.hero h1{font-size:clamp(2.3rem,5.6vw,4rem);font-weight:800;letter-spacing:-.03em;line-height:.98}
.hero h1 em{font-style:normal;color:var(--teal)}
.lede{margin-top:16px;max-width:52ch;color:var(--ink-2);font-size:1.06rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.hero-panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.hero-art{position:relative;aspect-ratio:260/150;max-width:100%;border-radius:14px;overflow:hidden;background:var(--card-2)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s}
.hero-cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.92rem}
.hero-cap b{font-family:var(--f-display);font-size:1.1rem}
.hero-cap span{color:var(--ink-2);font-family:var(--f-mono);font-size:.8rem}
.phase-dots{display:flex;gap:6px}
.phase-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s}
.phase-dots i.on{background:var(--teal)}

.sec-title{font-size:1.4rem;font-weight:750;margin:6px 0 14px;display:flex;align-items:baseline;gap:10px}
.sec-title small{font:500 .9rem var(--f-body);color:var(--ink-2)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lvl{position:relative;text-align:left;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:18px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .2s, box-shadow .2s, border-color .2s;min-width:0}
.lvl:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in oklab,var(--c) 55%,var(--line))}
.lvl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvl-ic{width:50px;height:50px;border-radius:14px;background:var(--c);display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.lvl-ic svg{width:26px;height:26px}
.lvl-num{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2);letter-spacing:.06em}
.lvl h3{font-size:1.25rem;font-weight:750}
.lvl p{color:var(--ink-2);font-size:.93rem}
.lvl-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:.85rem;color:var(--ink-2)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.star-on{fill:#E6A817}
.star-off{fill:var(--line)}
.done-tag{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:999px}
.final-card{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:20px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line)}
.final-card h3{font-size:1.25rem}
.final-card p{color:var(--ink-2);font-size:.93rem}
.final-card .lvl-ic{--c:#2E3B44}
.foot-note{margin-top:28px;font-size:.82rem;color:var(--ink-2);max-width:80ch}

/* ---------- hatırlatma ---------- */
.intro-head{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.intro-head h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.intro-head p{color:var(--ink-2)}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ref{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.ref h3{font-size:1.08rem;margin-bottom:10px}
.ref ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.93rem}
.ref li::marker{color:var(--teal)}
.ref b{font-weight:700}
.ref-art{margin:-4px -4px 10px;border-radius:10px;background:var(--card-2);overflow:hidden}
.ref-art svg{display:block;width:100%;height:auto}
.sticky-cta{position:sticky;bottom:0;margin-top:20px;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--paper) 30%);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* ---------- oyun HUD ---------- */
.play-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;margin-bottom:12px}
.ph-title{min-width:0}
.ph-title small{display:block;font-size:.78rem;color:var(--ink-2);font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.ph-title b{font-family:var(--f-display);font-size:1.15rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lives{display:flex;gap:2px}
.lives svg{width:24px;height:24px;transition:transform .3s, opacity .3s}
.glove{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.4}
.lives .lost{opacity:.3;transform:scale(.8) rotate(-12deg)}
.lives .lost .glove{fill:var(--wound-soft);stroke:var(--wound)}
.lives.hit{animation:shake .45s}
.score{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:72px;text-align:right}
.streak{font-size:.72rem;color:var(--warn);font-weight:700;display:block;text-align:right;min-height:1em}

.stage{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow);min-width:0}
.stage-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stage h2{font-size:clamp(1.3rem,3vw,1.75rem);font-weight:750}
.round-type{font-size:.72rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.prompt{color:var(--ink-2);margin-bottom:16px;max-width:70ch}
.how{font-size:.85rem;color:var(--ink-2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.how svg{width:16px;height:16px;flex:none}

/* eşleştirme */
.chip-tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;padding:12px;border-radius:14px;background:var(--card-2);border:1px dashed var(--line);min-height:62px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:650;font-size:.95rem;
  box-shadow:0 2px 0 var(--line);transition:transform .15s,border-color .15s,box-shadow .15s}
.chip:hover{border-color:var(--teal)}
.chip.sel{border-color:var(--teal);background:var(--teal-soft);transform:translateY(-2px);box-shadow:0 4px 0 var(--teal)}
.chip.dragging{opacity:.35}
.drag-ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:0 18px 40px -12px rgba(0,0,0,.45)!important;opacity:.96}
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.targets.timeline{grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.target{position:relative;border:1.5px solid var(--line);border-radius:14px;background:var(--card-2);padding:10px;display:grid;gap:8px;align-content:start;transition:border-color .2s, box-shadow .2s, transform .2s;cursor:pointer;min-width:0}
.picking .target:not(.done){border-style:dashed;border-color:color-mix(in oklab,var(--teal) 60%,var(--line))}
.target.hover{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft);transform:scale(1.01)}
.target.done{border-color:var(--ok);background:color-mix(in oklab,var(--ok-soft) 55%,var(--card-2));cursor:default}
.t-art{border-radius:10px;overflow:hidden;background:var(--card)}
.t-art svg{display:block;width:100%;height:auto}
.t-time{font-family:var(--f-mono);font-size:.78rem;font-weight:700;color:var(--teal)}
.t-cap{font-size:.9rem;font-weight:600;line-height:1.35}
.slot{min-height:42px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;padding:6px;text-align:center}
.slot-ph{font-size:.8rem;color:var(--ink-2)}
.slot-fill{font-weight:750;color:var(--ok);animation:pop .4s}
.target.done .slot{border-style:solid;border-color:var(--ok);background:var(--card)}
.t-reveal{font-size:.83rem;color:var(--ink-2);animation:enter .4s}

/* sıralama */
.order-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.col-h{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px;font-family:var(--f-body);font-weight:750;display:flex;justify-content:space-between}
.pool{display:grid;gap:8px}
.step{touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card-2);cursor:grab;font-size:.94rem;font-weight:550;transition:transform .2s,opacity .3s,border-color .2s,max-height .35s,padding .35s,margin .35s;max-height:140px}
.step:hover{border-color:var(--teal)}
.grip{width:10px;height:18px;flex:none;background:radial-gradient(circle,var(--ink-2) 1.2px,transparent 1.6px) 0 0/5px 6px;opacity:.6}
.step.used{opacity:0;max-height:0;padding-block:0;border-width:0;margin:-4px 0;overflow:hidden}
.step.trap{text-decoration:line-through;color:var(--wound);border-color:var(--wound);background:var(--wound-soft);cursor:not-allowed}
.step.hint{animation:pulseRing 1s 3}
.seq{position:relative;list-style:none;margin:0;padding:12px;border-radius:14px;border:1.5px dashed var(--line);background:var(--card-2);display:grid;gap:6px;max-height:640px;overflow:auto}
.seq.hover{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.seq-slot{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:10px;font-size:.88rem;color:var(--ink-2)}
.seq-slot .num{font-family:var(--f-mono);font-weight:700;font-size:.78rem;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.seq-slot.next{background:var(--card);outline:2px dashed var(--teal);outline-offset:-2px}
.seq-slot.filled{color:var(--ink);background:var(--card);animation:enter .35s}
.seq-slot.filled .num{background:var(--ok);border-color:var(--ok);color:#fff}

/* soru */
.q-card{display:grid;gap:14px;animation:enter .35s}
.q-label{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px}
.q-art{max-width:460px;border-radius:12px;overflow:hidden;background:var(--card-2)}
.q-art svg{display:block;width:100%;height:auto}
.q-text{font-size:clamp(1.12rem,2.4vw,1.35rem);font-weight:700;line-height:1.3;max-width:62ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);cursor:pointer;font-weight:550;transition:border-color .2s,background .2s,opacity .2s,transform .15s}
.opt:hover{border-color:var(--teal);transform:translateY(-1px)}
.opt-k{font-family:var(--f-mono);font-weight:700;font-size:.8rem;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.answered .opt{cursor:default;transform:none}
.answered .opt:not(.right):not(.wrong){opacity:.5}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--wound);background:var(--wound-soft)}
.opt.wrong .opt-k{background:var(--wound);border-color:var(--wound);color:#fff}
.tf .opts{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;align-items:center;font-size:1.1rem;font-weight:750;min-height:64px}
.tf .opt-k{display:none}
.tf .q-text{font-size:clamp(1.15rem,2.8vw,1.55rem);padding:22px;border-radius:16px;background:var(--card-2);border:1px solid var(--line)}
.why{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--teal-soft);font-size:.95rem;animation:enter .35s}
.why.bad{background:var(--wound-soft)}
.why svg{width:22px;height:22px;flex:none;margin-top:1px}
.q-actions{display:flex;justify-content:flex-end}
.qtimer{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.qtimer>i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left;transition:transform linear}
.qtimer.low>i{background:var(--wound)}

/* yüzde hesabı */
.tbsa{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.case{padding:16px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);font-size:1rem}
.case b{font-family:var(--f-display)}
.bodies{display:flex;justify-content:center;gap:clamp(10px,4vw,40px)}
.body-v{display:grid;justify-items:center;gap:4px;font-size:.8rem;color:var(--ink-2);font-weight:650;flex:1;max-width:190px}
.body-v svg{width:100%;height:auto;overflow:visible}
.rg{fill:var(--fig);stroke:var(--fig-line);stroke-width:1;cursor:pointer;transition:fill .25s, filter .25s}
.rg:hover{filter:brightness(1.06)}
.rg.on{fill:url(#gBurn);stroke:#9E2B1D}

const ROUNDS = {};
const howLine = (text) => h('p', { class: 'how' }, h('span', { html: ICON.hand }), text);

/* ---- eşleştirme ---- */
ROUNDS.match = (body, r, run) => new Promise((res) => {
  const pairs = r.pairs;
  const items = shuffle(pairs);
  const targets = r.layout === 'timeline' ? pairs : shuffle(pairs);
  let selected = null, placed = 0;
  const tray = h('div', { class: 'chip-tray', 'aria-label': 'Kartlar' });
  const grid = h('div', { class: 'targets ' + (r.layout || 'grid') });
  const clearSel = () => { if (selected) selected.classList.remove('sel'); selected = null; body.classList.remove('picking'); };
  const select = (c) => {
    if (run.dead) return; Sound.tap();
    if (selected === c) { clearSel(); return; }
    clearSel(); selected = c; c.classList.add('sel'); body.classList.add('picking');
  };
  const attempt = (c, t) => {
    if (run.dead || !c || t.classList.contains('done')) return;
    const it = pairs.find((p) => p.id === c.dataset.id);
    if (c.dataset.id === t.dataset.id) {
      run.good(t); t.classList.add('done'); t.removeAttribute('tabindex');
      const slot = $('.slot', t); slot.replaceChildren(h('span', { class: 'slot-fill' }, it.label));
      const rv = $('.t-reveal', t); if (rv) rv.hidden = false;
      c.remove(); clearSel(); placed++;
      if (placed === pairs.length) setTimeout(res, 700);
    } else {
      clearSel();
      if (run.bad(t)) toast('bad', `${it.label} buraya ait değil`, it.hint, 6500);
    }
  };
  items.forEach((it) => {
    const c = h('button', { class: 'chip', type: 'button', 'data-id': it.id }, it.label);
    enableDrag(c, { onTap: () => select(c), onDrop: (u) => { const t = u && u.closest('.target'); if (t && grid.contains(t)) attempt(c, t); } });
    tray.append(c);
  });
  targets.forEach((p) => {
    const t = h('div', { class: 'target droppable', 'data-id': p.id, tabindex: '0', role: 'button', 'aria-label': (p.time ? p.time + ', ' : '') + (p.caption || 'Hedef') },
      p.time ? h('span', { class: 't-time' }, p.time) : null,
      p.art ? h('div', { class: 't-art', html: p.art() }) : null,
      p.caption ? h('p', { class: 't-cap' }, p.caption) : null,
      h('div', { class: 'slot' }, h('span', { class: 'slot-ph' }, 'Kartı buraya bırak')),
      p.reveal ? h('p', { class: 't-reveal', hidden: true }, p.reveal) : null);
    onActivate(t, () => { if (selected) attempt(selected, t); else if (!t.classList.contains('done')) { shake(tray); toast('info', 'Önce bir kart seç', 'Üstteki kartlardan birine dokun, sonra bu alana dokun.', 2600); } });
    grid.append(t);
  });
  body.append(howLine('Bir kartı seç, sonra doğru alana dokun ya da kartı sürükleyip bırak.'), tray, grid);
});

/* ---- adım sıralama ---- */
ROUNDS.order = (body, r, run) => new Promise((res) => {
  const steps = r.steps.map((s, i) => ({ ...s, idx: i, real: true }));
  const all = shuffle([...steps, ...(r.distractors || []).map((d) => ({ ...d, real: false }))]);
  let next = 0;
  const pool = h('div', { class: 'pool' });
  const seq = h('ol', { class: 'seq droppable', 'aria-label': 'Senin sıralaman' });
  const progress = h('span', { class: 'mono' }, `0/${steps.length}`);
  steps.forEach((s, i) => seq.append(h('li', { class: 'seq-slot' + (i === 0 ? ' next' : '') }, h('span', { class: 'num' }, i + 1), h('span', { class: 'seq-txt' }, i === 0 ? 'İlk adım?' : '…'))));
  const cards = [];
  const pick = (c, st) => {
    if (run.dead || c.disabled) return;
    if (st.real && st.idx === next) {
      const slot = seq.children[next];
      slot.classList.remove('next'); slot.classList.add('filled'); $('.seq-txt', slot).textContent = st.text;
      run.good(c); c.disabled = true;
      const sr = seq.getBoundingClientRect(); if (sr.top > innerHeight || sr.bottom < 0) toast('ok', `${next + 1}. adım doğru`, st.text, 2200); c.classList.add('used'); setTimeout(() => c.remove(), 380);
      next++; progress.textContent = `${next}/${steps.length}`;
      if (seq.children[next]) { seq.children[next].classList.add('next'); $('.seq-txt', seq.children[next]).textContent = 'Sıradaki adım?'; seq.scrollTo({ top: Math.max(0, slot.offsetTop - seq.clientHeight / 2), behavior: reduceMotion ? 'auto' : 'smooth' }); }
      if (next === steps.length) setTimeout(res, 700);
    } else if (!st.real) {
      c.disabled = true; c.classList.add('trap');
      if (run.bad(c)) toast('bad', 'Bu yanlış bir uygulama', st.why, 7000);
    } else {
      if (run.bad(c)) toast('bad', 'Bu adımın sırası henüz gelmedi', st.why, 6500);
    }
  };
  all.forEach((st) => {
    const c = h('button', { class: 'step', type: 'button' }, h('span', { class: 'grip', 'aria-hidden': 'true' }), h('span', {}, st.text));
    enableDrag(c, { onTap: () => pick(c, st), onDrop: (u) => { if (u && u.closest('.seq')) pick(c, st); } });
    cards.push([c, st]); pool.append(c);
  });
  const hintBtn = h('button', { class: 'btn small ghost', type: 'button', html: ICON.bulb + '<span>İpucu (−50)</span>' });
  hintBtn.querySelector('svg').style.cssText = 'width:16px;height:16px';
  hintBtn.onclick = () => {
    const pair = cards.find(([c, st]) => st.real && st.idx === next && c.isConnected);
    if (!pair) return; run.spend(50); pair[0].classList.remove('hint'); void pair[0].offsetWidth; pair[0].classList.add('hint');
    pair[0].scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  };
  body.append(
    howLine('Adımları doğru sırayla seç (dokun ya da sağdaki listeye sürükle). Bazı kartlar yanlış uygulamadır, onları seçme.'),
    h('div', { class: 'order-grid' },
      h('div', {}, h('h3', { class: 'col-h' }, h('span', {}, 'Adım kartları'), hintBtn), pool),
      h('div', {}, h('h3', { class: 'col-h' }, h('span', {}, 'Senin sıralaman'), progress), seq)));
});

/* ---- soru (çoktan seçmeli + doğru/yanlış) ---- */
function askQuestion(body, q, run, label, opts = {}) {
  return new Promise((res) => {
    body.replaceChildren();
    const correctIdx = q.correct || 0;
    let options = q.options.map((t, i) => ({ t, ok: i === correctIdx }));
    if (!q.fixed) options = shuffle(options);
    let answered = false, timer = null;
    const list = h('div', { class: 'opts' });
    const why = h('div', { class: 'why', hidden: true });
    const nextBtn = h('button', { class: 'btn primary', type: 'button', hidden: true, onclick: () => { clearTimeout(timer); res(); } }, opts.last ? 'Bitir' : 'Devam →');
    const tbar = opts.time ? h('div', { class: 'qtimer' }, h('i')) : null;
    const reveal = (ok, prefix) => {
      why.hidden = false; why.className = 'why' + (ok ? '' : ' bad');
      why.replaceChildren(h('span', { html: ok ? ICON.check : ICON.info }), h('div', {}, h('strong', {}, prefix), ' ', q.why || ''));
      nextBtn.hidden = false; nextBtn.focus({ preventScroll: true });
      if (opts.time && tbar) tbar.firstChild.style.transition = 'none';
    };
    const choose = (b, o) => {
      if (answered || run.dead) return; answered = true; clearTimeout(timer); list.classList.add('answered');
      const rightBtn = [...list.children][options.findIndex((x) => x.ok)];
      if (o.ok) { b.classList.add('right'); run.good(b, false, q); reveal(true, 'Doğru!'); }
      else {
        b.classList.add('wrong'); rightBtn.classList.add('right');
        if (run.bad(b, q) === false) return;
        reveal(false, `Doğru cevap: ${options.find((x) => x.ok).t}.`);
      }
    };
    options.forEach((o, i) => {
      const b = h('button', { class: 'opt', type: 'button' }, h('span', { class: 'opt-k' }, 'ABCDE'[i]), h('span', {}, o.t));
      b.onclick = () => choose(b, o); list.append(b);
    });
    const card = h('div', { class: 'q-card' + (q.fixed ? ' tf' : '') },
      h('p', { class: 'q-label' }, h('span', {}, label), opts.topic ? h('span', {}, opts.topic) : null),
      tbar,
      q.art ? h('div', { class: 'q-art', html: q.art() }) : null,
      h('h3', { class: 'q-text' }, q.q), list, why, h('div', { class: 'q-actions' }, nextBtn));
    body.append(card);
    if (opts.time) {
      requestAnimationFrame(() => requestAnimationFrame(() => { const i = tbar.firstChild; i.style.transition = `transform ${opts.time}s linear`; i.style.transform = 'scaleX(0)'; }));
      setTimeout(() => tbar.classList.add('low'), opts.time * 700);
      timer = setTimeout(() => {
        if (answered || run.dead || !card.isConnected) return; answered = true; list.classList.add('answered');
        [...list.children][options.findIndex((x) => x.ok)].classList.add('right');
        run.bad(null, q); reveal(false, `Süre doldu. Doğru cevap: ${options.find((x) => x.ok).t}.`);
      }, opts.time * 1000);
    }
  });
}
ROUNDS.quiz = async (body, r, run) => {
  for (let i = 0; i < r.questions.length; i++) {
    if (run.dead) return;
    await askQuestion(body, r.questions[i], run, `Soru ${i + 1}/${r.questions.length}`);
  }
};
const tfToQ = (it) => ({ q: it.s, options: ['Doğru', 'Yanlış'], correct: it.a ? 0 : 1, fixed: true, why: it.why });
ROUNDS.tf = async (body, r, run) => {
  const items = shuffle(r.items);
  for (let i = 0; i < items.length; i++) {
    if (run.dead) return;
    await askQuestion(body, tfToQ(items[i]), run, `İfade ${i + 1}/${items.length}`);
  }
};

/* ---- %TBSA (Dokuzlar Kuralı) ---- */
ROUNDS.tbsa = async (body, r, run) => {

    await tbsaCase(body, r.cases[i], run, i, r.cases.length);

};
function tbsaCase(body, cs, run, i, n) {
  return new Promise((res) => {
    body.replaceChildren();
    const sel = new Set(); let locked = false;
    const total = () => [...sel].reduce((s, id) => s + REGION[id][1], 0);
    const out = h('output', { class: 'tbsa-total', 'aria-live': 'polite' }, '%0');
    const figs = h('div', { class: 'bodies', html: bodyFigure('f') + bodyFigure('b') });
    const toggle = (p) => {
      if (locked || run.dead) return; const id = p.dataset.r;
      if (sel.has(id)) sel.delete(id); else sel.add(id);
      p.classList.toggle('on', sel.has(id)); p.setAttribute('aria-pressed', sel.has(id));
      Sound.tap(); out.textContent = '%' + fmt(total());
    };
    figs.addEventListener('click', (e) => { const p = e.target.closest('[data-r]'); if (p) toggle(p); });
    figs.addEventListener('keydown', (e) => { const p = e.target.closest('[data-r]'); if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(p); } });
    const why = h('div', { class: 'why', hidden: true });
    const nextBtn = h('button', { class: 'btn primary', type: 'button', hidden: true, onclick: res }, 'Devam →');
    const checkBtn = h('button', { class: 'btn primary', type: 'button' }, 'Kontrol et');
    const clearBtn = h('button', { class: 'btn', type: 'button' }, 'Temizle');
    clearBtn.onclick = () => { if (locked) return; sel.clear(); $$('.rg', figs).forEach((p) => { p.classList.remove('on'); p.setAttribute('aria-pressed', 'false'); }); out.textContent = '%0'; };
    checkBtn.onclick = () => {
      if (locked || run.dead) return;
      if (!sel.size) { toast('info', 'Önce bölgeleri işaretle', 'Yanık olan bölgelere dokunarak boya.', 2600); return; }
      locked = true; checkBtn.disabled = true; clearBtn.disabled = true;
      const ans = new Set(cs.regions);
      const ok = ans.size === sel.size && [...ans].every((x) => sel.has(x));
      const ansTotal = cs.regions.reduce((s, id) => s + REGION[id][1], 0);
      if (ok) run.good(out);
      else {
        $$('.rg', figs).forEach((p) => { const id = p.dataset.r; if (ans.has(id) && !sel.has(id)) p.classList.add('miss'); if (!ans.has(id) && sel.has(id)) p.classList.add('extra'); });
        if (run.bad(out) === false) return;
      }
      why.hidden = false; why.className = 'why' + (ok ? '' : ' bad');
      why.replaceChildren(h('span', { html: ok ? ICON.check : ICON.info }), h('div', {}, h('strong', {}, ok ? `Doğru: %${fmt(ansTotal)}.` : `Doğru cevap %${fmt(ansTotal)}. Kesik çizgili bölgeler eksik, taralı bölgeler fazla.`), ' ', cs.why));
      nextBtn.hidden = false; nextBtn.focus({ preventScroll: true });
    };
    body.append(
      h('p', { class: 'q-label' }, h('span', {}, `Vaka ${i + 1}/${n}`)),
      h('div', { class: 'tbsa' },
        h('div', {}, figs),
        h('div', { style: { display: 'grid', gap: '12px', alignContent: 'start' } },
          h('div', { class: 'case', html: cs.text }),
          h('div', {}, h('small', { style: { color: 'var(--ink-2)', fontWeight: 650 } }, 'İşaretlediğin alan'), out),
          h('div', { class: 'tbsa-actions' }, clearBtn, checkBtn),
          why, h('div', { class: 'q-actions' }, nextBtn),
          h('div', { class: 'nines', 'aria-label': 'Dokuzlar Kuralı' },
            ...[['Baş-boyun', '%9'], ['Her bir kol', '%9'], ['Gövde ön', '%18'], ['Gövde arka', '%18'], ['Her bir bacak', '%18'], ['Perine', '%1']].flatMap(([a, b]) => [h('span', {}, a), h('span', {}, b)])))));
  });
}

/* ---- sahnede nokta bulma ---- */
ROUNDS.spots = (body, r, run) => new Promise((res) => {
  const need = r.spots.filter((s) => s.err).length; let found = 0;
  const scene = h('div', { class: 'scene', html: r.scene() });
  const svg = $('svg', scene);
  const counter = h('span', { class: 'mono' }, `0/${need}`);
  const label = (s, g) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'spot-lbl'); t.setAttribute('x', s.x); t.setAttribute('y', s.y - (s.r || 30) - 6); t.textContent = s.title;
    g.append(t);
  };
  const hit = (s, g) => {
    if (run.dead || g.classList.contains('checked')) return;
    g.classList.add('checked'); g.removeAttribute('tabindex'); label(s, g);
    if (s.err) {
      g.classList.add('found'); found++; counter.textContent = `${found}/${need}`; run.good(g);
      toast('ok', s.title, s.why, 6000);
      if (found === need) setTimeout(res, 1100);
    } else {
      g.classList.add('fine');
      if (run.bad(g)) toast('bad', `${s.title}: ${r.fineLabel || 'bu doğru uygulama'}`, s.why, 6000);
    }
  };
  r.spots.forEach((s) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'spot'); g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    g.setAttribute('aria-label', r.dots ? 'İşaretli nokta' : 'Sahnedeki nesne');
    g.innerHTML = `<circle class="hit" cx="${s.x}" cy="${s.y}" r="${s.r || 30}"/>${r.dots ? `<circle class="pin" cx="${s.x}" cy="${s.y}" r="7"/>` : ''}`;
    onActivate(g, () => hit(s, g));
    svg.append(g);
  });
  body.append(howLine(r.how), h('div', { class: 'scene-wrap' }, h('div', { class: 'counter' }, h('span', {}, r.counterLabel), counter), scene));
});

/* ---- tampon tekniği (cerrahi kesi temizliği) ---- */
ROUNDS.swab = (body, r, run) => new Promise((res) => {
  const id = uid('sw'), CX = 150, CENTER = 16;
  const wrap = h('div', { html: swabScene(id) });
  const svg = wrap.firstElementChild;
  const gStrokes = $('.strokes', svg), gClean = $('.clean', svg), dirt = $$('.dirt circle', svg);
  const state = { center: false, L: 0, R: 0, offL: 0, offR: 0, used: 0, done: false };
  const ck = (key, text) => h('li', { 'data-k': key }, h('span', { class: 'ck' }, ''), h('span', { class: 'ck-t' }, text));
  const checks = h('ul', { class: 'checks' }, ck('c', '1. silme: insizyon hattı'), ck('L', 'Sol yan: içten dışa 0/2'), ck('R', 'Sağ yan: içten dışa 0/2'));
  const gauzes = h('div', { class: 'gauzes', 'aria-label': 'Kullanılan tamponlar' });
  const usedTxt = h('span', { class: 'mono' }, '0');
  const refresh = () => {
    const set = (k, ok, txt) => { const li = $(`[data-k="${k}"]`, checks); li.classList.toggle('ok', ok); $('.ck', li).textContent = ok ? '✓' : ''; if (txt) $('.ck-t', li).textContent = txt; };
    set('c', state.center); set('L', state.L >= 2, `Sol yan: içten dışa ${Math.min(state.L, 2)}/2`); set('R', state.R >= 2, `Sağ yan: içten dışa ${Math.min(state.R, 2)}/2`);
    usedTxt.textContent = state.used;
  };
  const pt = (e) => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  let pts = null, live = null, pid = null;
  svg.addEventListener('pointerdown', (e) => {
    if (run.dead || state.done || e.button !== 0) return; e.preventDefault();
    pid = e.pointerId; try { svg.setPointerCapture(pid); } catch (err) { }
    pts = [pt(e)];
    live = document.createElementNS(NS, 'path'); live.setAttribute('class', 'sw-live'); gStrokes.append(live);
  });
  svg.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid || !pts) return;
    const p = pt(e), l = pts[pts.length - 1];
    if (Math.hypot(p.x - l.x, p.y - l.y) < 2.5) return;
    pts.push(p); live.setAttribute('d', 'M' + pts.map((q) => `${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' L'));
  });
  const end = (e) => {
    if (e.pointerId !== pid || !pts) return; pid = null;
    const P = pts, path = live; pts = null; live = null;
    if (e.type === 'pointercancel') { path.remove(); return; }
    evaluate(P, path);
  };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);

  const fail = (path, title, why) => {
    path.setAttribute('class', 'sw-bad'); setTimeout(() => (path.style.opacity = 0), 60); setTimeout(() => path.remove(), 1300);
    state.used++; gauzes.append(h('i', { class: 'bad', title: 'Hatalı silme' })); refresh();
    if (run.bad(svg)) toast('bad', title, why, 6500);
  };
  const success = (path, P, title, why) => {
    path.setAttribute('class', 'sw-ok'); gClean.append(path);
    dirt.forEach((d) => { const x = +d.getAttribute('cx'), y = +d.getAttribute('cy'); if (P.some((q) => Math.abs(q.x - x) < 15 && Math.abs(q.y - y) < 12)) d.classList.add('gone'); });
    state.used++; gauzes.append(h('i', { title: 'Tampon' })); refresh();
    run.good(path); toast('ok', title, why, 3800);
    if (state.center && state.L >= 2 && state.R >= 2) { state.done = true; setTimeout(res, 1200); }
  };
  function evaluate(P, path) {
    let len = 0; for (let i = 1; i < P.length; i++) len += Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y);
    const s = P[0], e = P[P.length - 1], dx = e.x - s.x, dy = e.y - s.y;
    if (len < 50) { path.remove(); toast('info', 'Silme çok kısa', 'Tamponu kesi boyunca tek ve kesintisiz bir hareketle çek.', 2600); return; }
    if (Math.abs(dx) > Math.abs(dy)) return fail(path, 'Yatay ovma yapma', 'Kesi, kendisine dik yönde ovulmaz. Kesi boyunca dikey, tek yönde sil.');
    if (dy < 0) return fail(path, 'Aşağıdan yukarı sildin', 'Silme temizden kirliye yapılır: kesinin baş tarafındaki ucundan başlayıp aşağı doğru, tek yönde.');
    let maxY = -1e9, rev = false; for (const q of P) { if (q.y > maxY) maxY = q.y; if (maxY - q.y > 16) rev = true; }
    if (rev) return fail(path, 'İleri-geri ovma yapma', 'Tampon tek yönde, tek kez kullanılır. Geri dönen hareket kirliliği temiz bölgeye taşır.');
    if (dy < 150) return fail(path, 'Kesinin tamamını sil', 'Tek silmede kesinin üst ucundan alt ucuna kadar in; yarım silme yeni tampon harcatır.');
    const mean = P.reduce((a, q) => a + q.x, 0) / P.length, off = Math.abs(mean - CX), side = mean < CX ? 'L' : 'R';
    if (!state.center) {
      if (off <= CENTER) { state.center = true; return success(path, P, 'İnsizyon hattı temizlendi', 'İlk tampon en temiz bölge olan kesi hattının tam üzerinden, yukarıdan aşağıya geçer.'); }
      return fail(path, 'Önce insizyon hattı', 'En temiz bölge kesi hattıdır. İlk tamponla kesinin tam üzerinden sil, sonra yanlara geç.');
    }
    if (off <= CENTER) return fail(path, 'Kesi hattına geri döndün', 'Yanlara geçtikten sonra insizyon hattına dönülmez; kesi çevresindeki kir kesiye taşınır.');
    const prev = side === 'L' ? state.offL : state.offR;
    if (off < prev + 8) return fail(path, 'İçe doğru sildin', 'Her yeni tampon bir öncekinin biraz dışından geçer: içten dışa ilerle.');
    if (side === 'L') { state.L++; state.offL = off; } else { state.R++; state.offR = off; }
    success(path, P, `Yeni tampon · ${side === 'L' ? 'sol' : 'sağ'} yan`, 'Doğru: yeni tamponla, öncekinin dışından, yukarıdan aşağıya tek silme.');
  }
  body.append(
    howLine('Parmağınla ya da fareyle kesi boyunca silme hareketi çiz. Her çizgi yeni bir steril tampondur.'),
    h('div', { class: 'swab' }, svg,
      h('div', {},
        checks,
        h('p', { style: { marginTop: '14px', fontWeight: 650 } }, 'Kullanılan tampon: ', usedTxt),
        gauzes,
        h('div', { class: 'rule-box' }, 'Kural: temizden kirliye. Önce kesi hattı, sonra kesinin iki yanında içten dışa doğru; her silmede yeni tampon, silme yönü baştan ayağa.'))));
  refresh();
});

/* ================= final sınavı ================= */
const FINAL_N = 20, FINAL_TIME = 30;
function buildPool() {
  return LEVELS.map((l) => {
    const qs = [];
    l.rounds.forEach((r) => {
      if (r.type === 'quiz') r.questions.forEach((q) => qs.push({ ...q, topic: l.id }));
      if (r.type === 'tf') r.items.forEach((it) => qs.push({ ...tfToQ(it), topic: l.id }));
    });
    return shuffle(qs);
  });
}
function pickBalanced(groups, n) {
  const g = groups.map((a) => [...a]), out = [];
  while (out.length < n && g.some((a) => a.length)) g.forEach((a) => { if (a.length && out.length < n) out.push(a.shift()); });
  return shuffle(out);
}
function renderFinalIntro() {
  stopRun(); current = { screen: 'final' };
  const fin = Store.data.final;
  swap(h('main', { class: 'wrap' },
    h('div', { class: 'intro-head' },
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Bölümlere dön', html: ICON.back, onclick: renderMenu }),
      h('div', { class: 'lvl-ic', style: { '--c': '#2E3B44' }, html: LEVEL_ICONS.cap }),
      h('div', {}, h('p', { class: 'eyebrow', style: { marginBottom: '4px' } }, 'Tüm bölümler'), h('h1', {}, 'Final sınavı'))),
    h('section', { class: 'stage' },
      h('div', { class: 'refs' },
        h('article', { class: 'ref' }, h('h3', {}, 'Kurallar'), h('ul', {},
          h('li', { html: `<b>${FINAL_N} soru</b>, altı bölümden dengeli dağıtılır.` }),
          h('li', { html: `Her soru için <b>${FINAL_TIME} saniye</b>; süre dolarsa yanlış sayılır.` }),
          h('li', { html: 'Eldiven yok: sınav sonuna kadar sürer.' }),
          h('li', { html: 'Sonunda konu konu karne alırsın.' }))),
        h('article', { class: 'ref' }, h('h3', {}, 'Derece'), h('ul', {},
          h('li', { html: '<b>%85+</b> Steril usta' }), h('li', { html: '<b>%70+</b> Güvenli uygulayıcı' }),
          h('li', { html: '<b>%50+</b> Gelişmekte' }), h('li', { html: '<b>%50 altı</b> Tekrar gerekli' }),
          fin ? h('li', { html: `En iyi sonucun: <b>${fin.correct}/${fin.total}</b> · ${fin.grade}` }) : null))),
      h('div', { class: 'q-actions', style: { marginTop: '18px' } },
        h('button', { class: 'btn primary', type: 'button', onclick: () => { Sound.ensure(); runFinal(); } }, 'Sınavı başlat')))));
}
const gradeOf = (p) => (p >= 0.85 ? 'Steril usta' : p >= 0.7 ? 'Güvenli uygulayıcı' : p >= 0.5 ? 'Gelişmekte' : 'Tekrar gerekli');
async function runFinal() {
  stopRun(); current = { screen: 'final' };
  const qs = pickBalanced(buildPool(), FINAL_N);
  const by = {}; LEVELS.forEach((l) => (by[l.id] = { c: 0, t: 0 }));
  const fr = {
    dead: false, correct: 0, streak: 0,
    good(el, _s, q) { this.correct++; this.streak++; by[q.topic].c++; Sound.ok(); if (el) { const r = el.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 14); } upd(); },
    bad(el) { this.streak = 0; Sound.bad(); shake(el); upd(); return true; },
  };
  activeRun = fr;
  const body = h('div', { class: 'stage-body' });
  const scoreEl = h('div', { class: 'score' }, '0');
  const tp = h('div', {});
  const titleEl = h('b', {}, 'Soru 1');
  function upd() { scoreEl.textContent = `${fr.correct} ✓`; }
  swap(h('main', { class: 'wrap' },
    h('div', { class: 'play-head', style: { gridTemplateColumns: 'auto minmax(0,1fr) auto' } },
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Sınavdan çık', html: ICON.back, onclick: renderFinalIntro }),
      h('div', { class: 'ph-title' }, h('small', {}, 'Final sınavı'), titleEl), scoreEl),
    tp, h('section', { class: 'stage' }, body)));
  for (let i = 0; i < qs.length; i++) {
    if (fr.dead) return;
    const q = qs[i]; by[q.topic].t++;
    titleEl.textContent = `Soru ${i + 1}/${qs.length}`;
    tp.replaceChildren(tape((i / qs.length) * 100));
    await askQuestion(body, q, fr, q.fixed ? 'Doğru mu, yanlış mı?' : 'Çoktan seçmeli', { time: FINAL_TIME, topic: LEVELS.find((l) => l.id === q.topic).title, last: i === qs.length - 1 });
  }
  if (fr.dead) return;
  activeRun = null;
  const p = fr.correct / qs.length, grade = gradeOf(p);
  const prev = Store.data.final;
  if (!prev || fr.correct > prev.correct) { Store.data.final = { correct: fr.correct, total: qs.length, grade }; Store.save(); }
  swap(h('main', { class: 'wrap' }, h('section', { class: 'result' },
    h('p', { class: 'eyebrow' }, 'Final sınavı karnesi'),
    h('div', { class: 'big-stars', html: starsHTML(p >= 0.85 ? 3 : p >= 0.7 ? 2 : p >= 0.5 ? 1 : 0) }),
    h('h1', {}, grade),
    h('p', { class: 'prompt', style: { margin: 0 } }, `${qs.length} sorudan ${fr.correct} doğru (%${Math.round(p * 100)}).`),
    h('div', { class: 'karne' },
      LEVELS.filter((l) => by[l.id].t).map((l) => {
        const v = by[l.id], pc = (v.c / v.t) * 100;
        return h('div', { class: 'karne-row' }, h('span', {}, l.title), tape(pc), h('span', { class: 'mono' }, `${v.c}/${v.t}`));
      })),
    h('p', { class: 'foot-note', style: { marginTop: 0 } }, 'İndikatör bandı ne kadar koyuysa o konuda o kadar güvendesin. Zayıf kalan bölümü yeniden oynayabilirsin.'),
    h('div', { class: 'res-actions' },
      h('button', { class: 'btn primary', type: 'button', onclick: runFinal }, 'Yeniden gir'),
      h('button', { class: 'btn ghost', type: 'button', onclick: renderMenu }, 'Bölümler')))));
  if (p >= 0.7) setTimeout(() => FX.rain(), 200);
}

/* ================= açılış ================= */
function start(data) {
  Store.load(); FX.init(); updateBar();
  $('#homeBtn').onclick = renderMenu;
  $('#soundBtn').onclick = () => { Store.data.sound = !Store.data.sound; Store.save(); updateBar(); if (Store.data.sound) Sound.tap(); };
  const s = data && data.screen;
  const lv = s === 'intro' && LEVELS.find((l) => l.id === data.id);
  if (lv) renderIntro(lv); else if (s === 'final') renderFinalIntro(); else renderMenu();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ ...current })); } catch (e) { }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
